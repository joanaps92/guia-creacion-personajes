<div class="container-fluid py-5 list-container">
  <div class="row justify-content-center mb-5">
    <div class="col-12 text-center position-relative">
      <h1 class="main-title display-3 mb-3">Culturas Heroicas</h1>
      <p class="lead text-muted fst-italic">Guía de creación de personajes para El Anillo Único 2ª Edición</p>
      <div class="title-separator mb-4"></div>
      <div class="form-check form-switch d-inline-block text-start">
        <input class="form-check-input" type="checkbox" role="switch" id="striderModeToggle" [checked]="isStriderMode" (change)="toggleStriderMode()">
        <label class="form-check-label fw-bold" for="striderModeToggle">
          <i class="bi bi-person-walking me-1"></i>Modo Trancos <small class="text-muted fw-normal">(NO Base 18)</small>
        </label>
      </div>
    </div>
  </div>

  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border text-crimson" role="status" style="width: 3rem; height: 3rem;">
      <span class="visually-hidden">Cargando...</span>
    </div>
    <h4 class="mt-3 text-muted">Buscando en los archivos de Rivendel...</h4>
  </div>

  <div class="row justify-content-center mb-5" *ngIf="!loading">
    <div class="col-12 col-md-8 col-lg-6 text-center">
      <label for="cultureSelect" class="form-label fw-bold mb-3" style="color: #cc3333; font-family: 'Cinzel', serif; font-size: 1.5rem;">Selecciona una Cultura</label>
      <select id="cultureSelect" class="form-select form-select-lg shadow-sm text-center custom-select-parchment py-3" [(ngModel)]="selectedCulture">
        <option [ngValue]="null" disabled selected>Elige una cultura para ver sus detalles...</option>
        <option *ngFor="let culture of cultures" [ngValue]="culture">{{culture.name}}</option>
      </select>
    </div>
  </div>

  <div class="row justify-content-center" *ngIf="!loading && selectedCulture">
    <div class="col-12 col-xl-10 fade-in">
      <app-culture-card [culture]="selectedCulture" [baseNO]="isStriderMode ? 18 : 20"></app-culture-card>
    </div>
  </div>
</div>
